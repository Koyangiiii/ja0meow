<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JaoMeowStore 🌌</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Mitr:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
--primary: #ff4aa2; 
--secondary: #ff7ebb; 
--bg-main: #0a080d; 
--bg-card: #16121a; 
--border-color: rgba(255, 74, 162, 0.25);
--text-muted: #ba8baf;
}
html { scroll-behavior: smooth; }
body {
font-family: 'Kanit', sans-serif;
background: var(--bg-main); color: #fff;
overflow-x: hidden;
padding-top: 70px; 
}
.bg-glow-1 {
position: fixed; top: -100px; left: -100px; width: 300px; height: 300px;
background: radial-gradient(circle, rgba(255,74,162,0.15) 0%, rgba(0,0,0,0) 70%);
z-index: -1; pointer-events: none;
}
.bg-glow-2 {
position: fixed; bottom: 20%; right: -150px; width: 400px; height: 400px;
background: radial-gradient(circle, rgba(255,74,162,0.15) 0%, rgba(0,0,0,0) 70%);
z-index: -1; pointer-events: none;
}
#pts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.pt { position: absolute; animation: ptUp linear infinite; opacity: 0; }
@keyframes ptUp {
0% { transform: translateY(105vh); opacity: 0; }
8% { opacity: 0.45; }
92% { opacity: 0.45; }
100% { transform: translateY(-8vh) rotate(360deg); opacity: 0; }
}
.hero {
background: linear-gradient(135deg, rgba(22, 18, 26, 0.95) 0%, rgba(255, 74, 162, 0.15) 100%);
padding: 40px 20px 65px;
text-align: center;
position: relative;
border-bottom: 1px solid var(--border-color);
margin-bottom: 40px;
box-shadow: 0 4px 30px rgba(255, 74, 162, 0.1);
}
.hero-title {
font-family: 'Mitr', sans-serif;
font-size: 38px; font-weight: 800; color: #fff;
margin-bottom: 4px; letter-spacing: 0.5px;
text-shadow: 0 0 15px rgba(255, 74, 162, 0.6);
}
.hero-time {
font-size: 14px; font-weight: 500; color: var(--secondary);
margin-bottom: 8px; letter-spacing: 0.5px;
text-shadow: 0 0 8px rgba(255, 126, 187, 0.4);
}
.hero-sub {
font-size: 13px; color: rgba(255,255,255,0.85);
margin-bottom: 15px;
line-height: 1.4;
}
.queue-btn-dashed {
display: block; width: 100%; padding: 14px; border: 2px dashed var(--primary);
border-radius: 15px; font-size: 16px; font-weight: 600; color: #fff; text-decoration: none;
background: rgba(255, 74, 162, 0.08); transition: all 0.2s; margin-bottom: 18px; cursor: pointer;
box-shadow: 0 0 15px rgba(255, 74, 162, 0.15); text-align: center;
}
.queue-btn-dashed:hover { background: rgba(255,74,162,0.18); transform: scale(1.02); }
.tab-container {
position: absolute;
bottom: -20px;
left: 50%;
transform: translateX(-50%);
display: flex;
background: var(--bg-card);
border: 1px solid var(--border-color);
border-radius: 30px;
padding: 4px;
width: 320px;
z-index: 10;
box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.tab-btn {
flex: 1;
padding: 8px 0;
border-radius: 25px;
border: none;
font-family: inherit;
font-size: 13px;
font-weight: 600;
cursor: pointer;
transition: all 0.3s ease;
background: transparent;
color: var(--text-muted);
}
.tab-btn.active {
background: linear-gradient(135deg, var(--primary), var(--secondary));
color: #fff;
box-shadow: 0 2px 10px rgba(255, 74, 162, 0.3);
}
.content { max-width: 600px; margin: 0 auto; padding: 0 20px 50px; position: relative; z-index: 5; }
.tab-content { display: none; animation: fadeIn 0.3s ease; }
.tab-content.active { display: block; }
@keyframes fadeIn {
from { opacity: 0; transform: translateY(10px); }
to { opacity: 1; transform: translateY(0); }
}
.info-card {
background: var(--bg-card);
border: 1px solid var(--border-color);
border-radius: 20px;
padding: 30px 24px;
text-align: center;
box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}
.info-card-title { font-size: 18px; font-weight: 700; color: var(--secondary); margin-bottom: 4px; }
.info-card-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
.info-row {
display: flex; justify-content: space-between; align-items: center;
padding: 14px 0;
border-bottom: 1px dashed rgba(255,255,255,0.1);
font-size: 14px;
}
.info-row:last-of-type { border-bottom: none; margin-bottom: 20px; }
.info-row span:first-child { color: var(--primary); font-weight: 600; text-align: left; padding-right: 10px; }
.info-row span:last-child { color: #fff; font-weight: 500; text-align: right; }
.floating-topics-container { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
.topic-pill {
background: rgba(255, 74, 162, 0.1); border: 1px solid var(--primary);
color: rgba(255, 255, 255, 0.7); padding: 6px 14px; border-radius: 20px; font-size: 12px;
font-weight: 500; cursor: pointer; transition: all 0.2s ease;
box-shadow: 0 4px 10px rgba(255, 74, 162, 0.1);
}
.topic-pill:active { transform: scale(0.95); }
.topic-pill.active {
background: var(--primary); color: #fff; border-color: var(--primary);
box-shadow: 0 4px 12px rgba(255, 74, 162, 0.3);
}
.floating-contact-bar {
position: fixed; top: 0; left: 0; right: 0;
background: rgba(22, 18, 26, 0.98); backdrop-filter: blur(10px);
border-bottom: 1px solid var(--border-color); padding: 14px 20px;
display: flex; justify-content: center; gap: 12px; align-items: center;
z-index: 1001; box-shadow: 0 5px 20px rgba(0,0,0,0.6);
}
.contact-item {
display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500;
color: rgba(255, 255, 255, 0.8); text-decoration: none; 
padding: 6px 12px; border-radius: 20px;
transition: all 0.25s ease;
}
.contact-item:hover { 
color: var(--primary); 
background: rgba(255, 74, 162, 0.12);
transform: translateY(-1px);
text-shadow: 0 0 8px rgba(255, 74, 162, 0.4);
}
.contact-icon { font-size: 16px; transition: transform 0.25s ease; }
.contact-item:hover .contact-icon { transform: scale(1.15); }
</style>
</head>
<body>
<div class="bg-glow-1"></div>
<div class="bg-glow-2"></div>
<div id="pts"></div>

<div class="floating-contact-bar">
    <a href="https://lin.ee/rI1pkuT" class="contact-item" target="_blank">
        <span class="contact-icon">💬</span><span>เจ้าเหมียวฯ.</span>
    </a>
    <a href="https://www.facebook.com/profile.php?id=61590349757368" class="contact-item" target="_blank">
        <span class="contact-icon">👥</span><span>เจ้าเหมียว วีสอง</span>
    </a>
    <a href="https://www.instagram.com/k0yangi_ii?igsh=ZDBnemRmNmI5amcy&utm_source=qr" class="contact-item" target="_blank">
        <span class="contact-icon">📸</span><span>k0yangi_ii</span>
    </a>
</div>

<div class="hero">
<div class="hero-title">JaoMeowStore</div>
<div class="hero-time">OPEN - CLOSE : 09.00 - 22.00</div>
<div class="hero-sub">เจ้าเหมียวรับทำ ป้าย โลโก้ ลายน้ำ คิวชีต ชีตรายรับ - รายจ่าย</div>
<div class="tab-container">
<button class="tab-btn active" id="btn-home" onclick="switchTab('home')">หน้าหลัก</button>
<button class="tab-btn" id="btn-info" onclick="switchTab('info')">รายละเอียด</button>
<button class="tab-btn" id="btn-products" onclick="switchTab('products')">กลุ่ม</button>
</div>
</div>

<div class="content">
<div id="tab-home" class="tab-content active">
<div class="info-card">
<div class="queue-btn-dashed" onclick="window.open('https://docs.google.com/spreadsheets/d/16wCpceIXo7ZxNgGABYBRbL682miaicVntDUmrrhlns8/edit?usp=drivesdk', '_blank')">
📋 CheckQ
</div>
</div>
</div>

<div id="tab-info" class="tab-content">
<div class="floating-topics-container">
<div class="topic-pill" id="pill-sign" onclick="selectTopic('สั่งงานป้าย')">✨ สั่งงานป้าย</div>
<div class="topic-pill" id="pill-sheet" onclick="selectTopic('google sheet')">📊 google sheet</div>
</div>
<div class="info-card">
<h3 class="info-card-title" id="infoCardTitle">Showcase & Contact</h3>
<p class="info-card-sub" id="infoCardSub">ช่องทางการติดต่อและรายละเอียดร้านค้า</p>
<div id="infoCardDetails"></div>
</div>
</div>

<div id="tab-products" class="tab-content">
    <div class="floating-topics-container">
        <div class="topic-pill active" onclick="filterProducts('ทั้งหมด', this)">กลุ่มทั้งหมด</div>
    </div>
</div>
</div>

<script>
const P = document.getElementById('pts');
['✦', '★', '✨', '✧', '★'].forEach(e => {
for (let j = 0; j < 3; j++) {
const d = document.createElement('div');
d.className = 'pt'; d.textContent = e;
d.style.cssText = `left:${Math.random()*100}vw;font-size:${8+Math.random()*6}px;color:${'#ff4aa2,#ff7ebb,#ba8baf'.split(',')[Math.floor(Math.random()*3)]};animation-duration:${10+Math.random()*15}s;animation-delay:${-Math.random()*25}s;`;
P.appendChild(d);
}
});

function switchTab(tabId) {
document.getElementById('btn-home').classList.remove('active');
document.getElementById('btn-info').classList.remove('active');
document.getElementById('btn-products').classList.remove('active');
document.getElementById(`btn-${tabId}`).classList.add('active');
document.getElementById('tab-home').classList.remove('active');
document.getElementById('tab-info').classList.remove('active');
document.getElementById('tab-products').classList.remove('active');
document.getElementById(`tab-${tabId}`).classList.add('active');
if (tabId === 'info') { selectTopic('สั่งงานป้าย'); }
}

function selectTopic(topicName) {
const cardTitle = document.getElementById('infoCardTitle');
const cardSub = document.getElementById('infoCardSub');
const cardDetails = document.getElementById('infoCardDetails');
const pillSign = document.getElementById('pill-sign');
const pillSheet = document.getElementById('pill-sheet');
pillSign.classList.remove('active');
pillSheet.classList.remove('active');

if (topicName === 'สั่งงานป้าย') {
pillSign.classList.add('active'); 
cardTitle.innerText = "📋 วิธีการสั่งงานป้าย";
cardDetails.innerHTML = `
<div class="info-row" style="flex-direction: column; align-items: flex-start; gap: 4px;">
<span style="color: var(--primary);">🛠️ การแก้งาน</span>
<span style="color: #fff; text-align: left; font-size: 13px; font-weight: 400;">หากลูกค้าต้องการแก้งานหลังจากที่มีการส่งงานแล้ว ทางร้านคิดค่าแก้ จุดละ 15฿</span>
</div>
<div style="margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
<a href="#" class="queue-btn-dashed" style="padding: 10px; font-size: 12px; margin-bottom: 0;">เลือกบล็อก</a>
<a href="#" class="queue-btn-dashed" style="padding: 10px; font-size: 12px; margin-bottom: 0;">เลือกของตกแต่ง</a>
<a href="#" class="queue-btn-dashed" style="padding: 10px; font-size: 12px; margin-bottom: 0;">เลือกตัวตูน</a>
<a href="#" class="queue-btn-dashed" style="padding: 10px; font-size: 12px; margin-bottom: 0;">เลือกฟอนต์</a>
</div>
`;
} else {
pillSheet.classList.add('active');
cardTitle.innerText = "📊 ข้อมูล Google Sheet";
cardDetails.innerHTML = `<p>เนื้อหา Google Sheet</p>`;
}
}

function filterProducts(category, el) {
    document.querySelectorAll('#tab-products .topic-pill').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
}
</script>
</body>
</html>
